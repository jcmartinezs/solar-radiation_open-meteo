[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "solar-radiation-open-meteo"
version = "0.1.0"
description = "Flask API to ingest solar radiation variables from Open-Meteo into MySQL"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "Flask==3.0.3",
  "Flask-SQLAlchemy==3.1.1",
  "Flask-Migrate==4.0.7",
  "python-dotenv==1.0.1",
  "requests==2.32.3",
  "PyMySQL==1.1.1",
  "gunicorn==22.0.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
