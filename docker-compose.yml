services:
  db:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: solar_radiation
      MYSQL_USER: solar_api
      MYSQL_PASSWORD: solar_api_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Use service name `db` as host.
      MYSQL_HOST: db
      MYSQL_PORT: 3306
      MYSQL_DB: solar_radiation
      MYSQL_USER: solar_api
      MYSQL_PASSWORD: solar_api_password

      OPEN_METEO_PRODUCT: archive
      OPEN_METEO_TIMEZONE: UTC

      # Change this before exposing anything beyond localhost.
      ADMIN_API_KEY: dev-admin-key
    ports:
      - "8000:8000"

volumes:
  mysql_data:
